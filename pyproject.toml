[project]
name = "lazarus"
version = "0.1.0"
description = "AI-powered revenue recovery agent — Razorpay Buildathon, Track 03"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "libsql-client>=0.3",
]

[project.optional-dependencies]
redis = ["redis>=5.2"]
# Phase 2/3 of the voice channel (docs/voice.md) - real Sarvam STT/TTS over
# a Pipecat pipeline, plus the Plivo SDK for ringing a real phone. Kept
# separate from the base dependencies deliberately: pipecat-ai's webrtc/
# silero extras pull in aiortc and a torch-based VAD model, a heavy native
# dependency chain that has known install friction on Windows. The webhook/
# chat/dashboard/voice-phase-1 app works with zero installs from this group.
voice = [
    "pipecat-ai[webrtc,websocket,silero,sarvam]",
    "plivo",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
